<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - Document RAG System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0f14;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #e6edf3;
        }

        /* Container */
        .chat-container {
            background: #11161c;
            border-radius: 10px;
            border: 1px solid #1f2933;
            width: 100%;
            max-width: 820px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .chat-header {
            background: #0f141a;
            border-bottom: 1px solid #1f2933;
            padding: 16px;
            text-align: left;
        }

        .chat-header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #e6edf3;
        }

        .chat-header p {
            font-size: 12px;
            color: #8b949e;
            margin-top: 2px;
        }

        /* Messages */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #0b0f14;
        }

        /* Message Layout */
        .message {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.ai {
            align-items: flex-start;
        }

        /* Bubble */
        .message-bubble {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
        }

        /* User Message */
        .message.user .message-bubble {
            background: #1f6feb;
            color: white;
            border-bottom-right-radius: 4px;
        }

        /* AI Message */
        .message.ai .message-bubble {
            background: #161b22;
            color: #e6edf3;
            border: 1px solid #1f2933;
            border-bottom-left-radius: 4px;
        }

        /* Labels */
        .message-label {
            font-size: 11px;
            color: #6e7681;
            margin-bottom: 4px;
        }

        /* Input Section */
        .input-container {
            padding: 16px;
            background: #0f141a;
            border-top: 1px solid #1f2933;
        }

        .input-form {
            display: flex;
            gap: 8px;
        }

        /* Input */
        .message-input {
            flex: 1;
            padding: 10px 12px;
            background: #0b0f14;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            font-size: 14px;
        }

        .message-input::placeholder {
            color: #6e7681;
        }

        .message-input:focus {
            outline: none;
            border-color: #1f6feb;
        }

        /* Button */
        .send-button {
            padding: 10px 16px;
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .send-button:hover {
            background: #388bfd;
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Loading */
        .loading {
            display: none;
            text-align: left;
            padding: 6px 0;
            color: #6e7681;
            font-size: 12px;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 3px;
        }

        .loading.active {
            display: block;
        }

        /* Error */
        .error-message {
            background: rgba(255, 80, 80, 0.1);
            color: #ff7b72;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: none;
            border: 1px solid rgba(255, 80, 80, 0.2);
        }

        .error-message.active {
            display: block;
        }




        .send-button:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>AI Chat Assistant</h1>
            <p>Made by Kartikey Gupta</p>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="message ai">
                <span class="message-label">AI Assistant</span>
                <div class="message-bubble">
                    Hello! I'm your AI assistant Made by Kartikey Gupta. How can I help you today?
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="error-message" id="errorMessage"></div>
            <div class="loading" id="loading">AI is thinking...</div>
            <form class="input-form" id="chatForm">
                {% csrf_token %}
                <input type="text" class="message-input" id="messageInput" placeholder="Type your message here..."
                    autocomplete="off" required>
                <button type="submit" class="send-button" id="sendButton">Send</button>
            </form>
        </div>
    </div>

    <script>
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const messagesContainer = document.getElementById('messagesContainer');
        const sendButton = document.getElementById('sendButton');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');

        function addMessage(text, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;

            const label = document.createElement('span');
            label.className = 'message-label';
            label.textContent = isUser ? 'You' : 'AI Assistant';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;

            messageDiv.appendChild(label);
            messageDiv.appendChild(bubble);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
            setTimeout(() => {
                errorMessage.classList.remove('active');
            }, 5000);
        }

        function setLoading(isLoading) {
            if (isLoading) {
                loading.classList.add('active');
                sendButton.disabled = true;
                messageInput.disabled = true;
            } else {
                loading.classList.remove('active');
                sendButton.disabled = false;
                messageInput.disabled = false;
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const message = messageInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            messageInput.value = '';
            setLoading(true);

            try {
                const formData = new FormData();
                formData.append('message', message);
                formData.append('csrfmiddlewaretoken', document.querySelector('[name=csrfmiddlewaretoken]').value);

                const response = await fetch('{% url "chat:send_message" %}', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    addMessage(data.ai_response, false);
                } else {
                    showError(data.error || 'An error occurred');
                }
            } catch (error) {
                showError('Failed to send message. Please try again.');
                console.error('Error:', error);
            } finally {
                setLoading(false);
                messageInput.focus();
            }
        });

        messageInput.focus();
    </script>
</body>

</html>
